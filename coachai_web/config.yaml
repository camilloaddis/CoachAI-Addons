name: Coach AI Web
version: "0.8.0"
slug: coachai_web
description: "Coach autonomo web: allenamento, recupero e diario alimentare"
arch:
  - amd64
startup: application
boot: auto
init: false
map:
  - type: share
    read_only: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Dashboard web
webui: "http://[HOST]:[PORT:8099]"
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:bike

options:
  intervals_athlete_id: ""
  intervals_api_key: ""
  groq_enabled: false
  groq_api_key: ""
  groq_model: "openai/gpt-oss-120b"
  intervals_sync_enabled: false
  intervals_details_enabled: false
  intervals_poll_seconds: 900
  node_red_stopped: false
  admin_api_token: ""
  data_source: snapshot
schema:
  intervals_athlete_id: str
  intervals_api_key: password
  groq_enabled: bool
  groq_api_key: password
  groq_model: str
  intervals_sync_enabled: bool
  intervals_details_enabled: bool
  intervals_poll_seconds: int(60,86400)
  node_red_stopped: bool
  admin_api_token: password
  data_source: list(snapshot|local)
