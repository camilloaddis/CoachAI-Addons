name: Coach AI Web
version: "0.6.0"
slug: coachai_web
description: Dashboard e servizi Coach AI, Telegram disabilitato per default
arch:
  - amd64
startup: application
boot: auto
init: false
map:
  - type: share
    read_only: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Dashboard web
webui: "http://[HOST]:[PORT:8099]"
panel_icon: mdi:bike

options:
  intervals_athlete_id: ""
  intervals_api_key: ""
  groq_enabled: false
  groq_api_key: ""
  groq_model: "openai/gpt-oss-120b"
  intervals_sync_enabled: false
  intervals_write_enabled: false
  intervals_poll_seconds: 900
  telegram_enabled: false
  node_red_stopped: false
  telegram_bot_token: ""
  telegram_chat_id: ""
  admin_api_token: ""
  data_source: snapshot
schema:
  intervals_athlete_id: str
  intervals_api_key: password
  groq_enabled: bool
  groq_api_key: password
  groq_model: str
  intervals_sync_enabled: bool
  intervals_write_enabled: bool
  intervals_poll_seconds: int(60,86400)
  telegram_enabled: bool
  node_red_stopped: bool
  telegram_bot_token: password
  telegram_chat_id: str
  admin_api_token: password
  data_source: list(snapshot|local)
